name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needed for the brews: section to push to the separate
          # homebrew-dispatch tap repo — the default GITHUB_TOKEN can't
          # write to a different repository.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # The Electron GUI, bundled with a matching dispatch binary, as one .dmg
  # per Mac architecture — attached to the release goreleaser just created.
  # Unsigned (ad-hoc): there's no Apple Developer ID in this repo's secrets.
  gui-dmg:
    needs: goreleaser
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Build DMGs
        working-directory: gui
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npm run dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" gui/dist/*.dmg --clobber
